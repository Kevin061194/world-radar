name: WORLD RADAR daily
on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: worldradar
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worldradar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 測試
        run: python -m unittest discover -s tests -q
      - name: 執行每日流程
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'gemini-2.5-flash' }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://api.openai.com/v1' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          ACTIONS_URL: ${{ vars.ACTIONS_URL }}
        run: python -m worldradar.run
      - name: 保存資料
        if: always()
        run: |
          git config user.name "worldradar-bot"
          git config user.email "worldradar-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "daily update $(date -u +%F)"
          git push
