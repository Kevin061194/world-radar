              p = pathlib.Path(rel)
              p.parent.mkdir(parents=True, exist_ok=True)
              if not p.exists() or p.read_text(encoding="utf-8") != text:
                  p.write_text(text, encoding="utf-8")
                  print("已更新", rel)
          PYEOF
      - name: 測試
        run: python -m unittest discover -s tests -q
      - name: 執行每日流程
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'gemini-2.5-flash' }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://api.openai.com/v1' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          ACTIONS_URL: ${{ vars.ACTIONS_URL }}
        run: python -m worldradar.run
      - name: 保存資料
        if: always()
        run: |
          git config user.name "worldradar-bot"
          git config user.email "worldradar-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "daily update $(date -u +%F)"
          git push
  build:
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: worldradar/docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
